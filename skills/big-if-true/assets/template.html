<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__REPORT_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400..700&display=swap">
<style>
  :root{
    --bg:#4a4a4d; --surface:#535356; --surface-strong:#5a5a5e;
    --text:#d7d7d8; --muted:#bdbdbf; --subtle:#a8a8ac;
    --accent:#e57373; --verify:#8ec5ec;
    --border:rgba(215,215,216,.16); --border-strong:rgba(215,215,216,.32);
    --supported:#6fd392; --review:#e57373; --cnv:#d6d6da;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
    --pad:clamp(18px,4.5vw,34px);
    --col:664px;
  }
  @media (min-width:1100px){:root{--col:704px}}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--verify);text-decoration:none}
  a:hover{text-decoration:underline}
  :is(a,button,summary,mark,[tabindex]):focus-visible{outline:2px solid var(--verify);outline-offset:2px}
  .page{max-width:var(--col);margin:0 auto;padding:clamp(24px,5vw,48px) var(--pad) 64px}

  /* ---- masthead ---- */
  .brandline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-style:italic;font-weight:560;font-size:1.05rem;color:var(--accent);letter-spacing:.01em}
  .brandsub{font-size:.66rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--subtle)}
  h1{font-family:var(--serif);font-weight:420;font-style:italic;font-size:clamp(1.5rem,1.02rem+2.6vw,2.2rem);line-height:1.2;margin:.55em 0 .4em;text-wrap:balance;letter-spacing:-.012em}
  .meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;column-gap:0;row-gap:2px}
  .meta span{white-space:nowrap}
  .meta span+span::before{content:"·";margin:0 .5em;color:var(--subtle)}

  /* ---- spine ---- */
  .spineblock{margin:26px 0 32px}
  .spine{display:flex;gap:2px;height:16px}
  .spine i{flex:1;min-width:2px;border-radius:1px;cursor:pointer;position:relative;opacity:.92;transition:opacity .15s,transform .15s}
  .spine i::after{content:"";position:absolute;left:-1px;right:-1px;top:-9px;bottom:-9px}
  .spine i:hover,.spine i:focus-visible{opacity:1;transform:scaleY(1.3)}
  .spine i:focus-visible{outline-offset:4px}
  .spine i.s{background:var(--supported)}.spine i.r{background:var(--review)}.spine i.c{background:var(--cnv);align-self:center;height:40%}
  #spine[data-f="r"] i:not(.r),#spine[data-f="c"] i:not(.c),#spine[data-f="s"] i:not(.s){opacity:.22}
  .spinecap{margin-top:9px;font-size:.66rem;color:var(--subtle);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:6px 18px;flex-wrap:wrap}
  .legend{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
  .legend span{white-space:nowrap}
  .legend i{display:inline-block;width:9px;height:2px;border-radius:1px;margin-right:5px;vertical-align:middle;transform:translateY(-1px)}
  .legend .s{background:var(--supported)}.legend .r{background:var(--review)}.legend .c{background:repeating-linear-gradient(90deg,var(--cnv) 0 3px,transparent 3px 5px)}
  @media (max-width:600px){.spine{height:22px;gap:1px}.spine i{border-radius:0}}

  /* ---- findings lede ---- */
  .lede{margin:0 0 26px}
  .lede .kicker{font-size:.66rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--subtle);margin-bottom:10px}
  .lede .topline{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(1rem,.94rem+.5vw,1.14rem);line-height:1.55;color:var(--text);margin:0 0 16px;max-width:56ch}
  .lede .topline b{font-weight:600;color:var(--review);font-style:normal}

  /* ---- sticky control bar ---- */
  .bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;
    overflow-x:auto;scrollbar-width:none;
    margin:0 calc(-1*var(--pad)) 30px;padding:10px var(--pad);
    background:rgba(72,72,75,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .bar::-webkit-scrollbar{display:none}
  .bar::after{content:"";flex:0 0 1px}
  .chips{display:flex;gap:6px;flex-wrap:nowrap;flex:none}
  .chip{white-space:nowrap}
  .views{flex:none}
  .tools{display:flex;gap:6px;flex:none;align-items:center}
  @media (min-width:700px){
    .bar{flex-wrap:nowrap;overflow:visible;justify-content:space-between;gap:8px 12px}
    .chips{order:1}
    .tools{order:2;margin-left:auto}
  }
  .chip{font:600 .7rem/1 var(--sans);letter-spacing:.01em;background:none;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:7px 9px;cursor:pointer;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
  .chip:hover{border-color:var(--border-strong)}
  .chip[aria-pressed="true"]{background:var(--surface-strong);color:var(--text);border-color:var(--border-strong)}
  .chip .n{opacity:.7;margin-left:3px}
  .chip.f-r{color:var(--review)}.chip.f-c{color:var(--cnv)}.chip.f-s{color:var(--supported)}
  .chip[aria-pressed="true"].f-r{color:var(--review)}.chip[aria-pressed="true"].f-c{color:var(--cnv)}.chip[aria-pressed="true"].f-s{color:var(--supported)}
  .views{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px}
  .views button{font:600 .72rem/1 var(--sans);background:none;border:0;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer}
  .views button[aria-pressed="true"]{background:var(--surface-strong);color:var(--text)}
  .export{position:relative;flex:none}
  .export>button::after{content:"";display:inline-block;margin-left:7px;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.7}
  .menu{position:absolute;right:0;top:calc(100% + 8px);z-index:50;min-width:172px;padding:6px;background:var(--surface-strong);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  @media (max-width:699px){.menu{position:fixed;left:auto;right:var(--pad);top:58px}}
  .menu .kicker{font:700 .6rem/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--subtle);padding:6px 8px 4px}
  .menu .row{display:flex;align-items:center;gap:2px}
  .menu .row.sep{border-top:1px solid var(--border);margin-top:4px;padding-top:4px}
  .menu button,.menu a{font:600 .72rem/1 var(--sans);background:none;border:0;color:var(--text);padding:8px 8px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .menu button:hover,.menu a:hover{background:var(--surface)}
  .menu .row button:first-child{flex:1;text-align:left}
  .menu .row .n{font-weight:400;color:var(--subtle);margin-left:5px;font-variant-numeric:tabular-nums}
  .menu .dl{color:var(--subtle);font-weight:500;padding:8px 7px}
  .menu .dl:hover{color:var(--text)}
  .menu .dl[hidden]{display:none}
  .copied{color:var(--supported)!important}
  .note .copy{border:0;background:none;color:var(--subtle);font:500 .72rem/1 var(--sans);padding:2px 6px;margin-left:8px;border-radius:5px;cursor:pointer;opacity:.6;transition:opacity .15s,color .15s,background .15s}
  .note:hover .copy,.note .copy:focus-visible,.note .copy.copied{opacity:1}
  .note .copy:hover{color:var(--text);background:var(--surface)}

  /* ---- article view ---- */
  .article .para{position:relative}
  .article p{font-family:var(--serif);font-weight:380;font-size:clamp(1rem,.96rem+.35vw,1.09rem);line-height:1.72;margin:0 0 1.2em;max-width:64ch}
  .article .q{font-style:italic;color:var(--muted)}

  /* proofreader tally: one tick per checked sentence, in the gutter */
  .pmarks{position:absolute;right:calc(100% + 5px);top:11px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .pmarks i{position:relative;display:block;width:9px;height:2px;border-radius:1px;cursor:pointer;transform-origin:right center;transition:transform .15s,opacity .15s}
  .pmarks i::after{content:"";position:absolute;left:-4px;right:-5px;top:-4px;bottom:-4px}
  .pmarks i.s{background:var(--supported);opacity:.7}
  .pmarks i.c{background:repeating-linear-gradient(90deg,var(--cnv) 0 3px,transparent 3px 5px);opacity:.8}
  .pmarks i.r{background:var(--review);opacity:.95;width:13px}
  .pmarks i:hover,.pmarks i.on{opacity:1;transform:scaleX(1.5)}

  /* the checking wash: sage marker pass, coral stays the loud one */
  mark{background:none;color:inherit;cursor:pointer;scroll-margin-top:80px;border-radius:2px;
    padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;
    text-underline-offset:4px;text-decoration-thickness:1px;
    transition:background .18s,text-decoration-color .18s}
  mark.s{background:rgba(111,211,146,.14)}
  mark.c{background:none;text-decoration-line:underline;text-decoration-style:dashed;text-decoration-color:rgba(214,214,218,.55)}
  mark.r{background:rgba(229,115,115,.13);text-decoration-line:underline;text-decoration-style:solid;text-decoration-color:var(--review);text-decoration-thickness:1.5px}
  mark.s:hover,mark.s.hl,mark.s.open{background:rgba(111,211,146,.22);text-decoration-line:underline;text-decoration-style:solid;text-decoration-color:rgba(111,211,146,.8)}
  mark.c:hover,mark.c.hl,mark.c.open{background:rgba(214,214,218,.1);text-decoration-color:rgba(214,214,218,.85)}
  mark.r:hover,mark.r.hl,mark.r.open{background:rgba(229,115,115,.2)}
  mark.flash{background:rgba(142,197,236,.16)!important}

  /* filters breathe: dim the rest, raise the match */
  .article[data-f] p{color:rgba(215,215,216,.52)}
  .article[data-f] .q{color:inherit}
  .article[data-f="r"] mark:not(.r),.article[data-f="c"] mark:not(.c),.article[data-f="s"] mark:not(.s){background:none;text-decoration-line:none}
  .article[data-f="r"] .pmarks i:not(.r),.article[data-f="c"] .pmarks i:not(.c),.article[data-f="s"] .pmarks i:not(.s){opacity:.14}
  .article[data-f="r"] mark.r,.article[data-f="c"] mark.c,.article[data-f="s"] mark.s{color:var(--text)}
  .article[data-f="s"] mark.s{background:rgba(111,211,146,.22);text-decoration-line:underline;text-decoration-style:solid;text-decoration-color:rgba(111,211,146,.8)}
  .article[data-f="c"] mark.c{background:rgba(214,214,218,.1);text-decoration-color:rgba(214,214,218,.85)}
  .article[data-f="s"] .pmarks i.s,.article[data-f="c"] .pmarks i.c,.article[data-f="r"] .pmarks i.r{opacity:1}

  .inline-notes{position:relative;margin:-6px 0 26px;max-width:480px;display:flex;flex-direction:column;gap:13px;animation:notein .18s ease-out}
  @keyframes notein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .inline-notes .note:first-child{padding-right:30px}
  .ic-close{position:absolute;top:-3px;right:0;z-index:2;width:26px;height:26px;border:0;background:none;color:var(--subtle);font:300 1.15rem/1 var(--sans);cursor:pointer;padding:0}
  .ic-close:hover{color:var(--text)}

  /* ---- claim note: editor's marginalia, not a card ---- */
  .note{position:relative;padding:1px 0 1px 15px;font-family:var(--sans);font-size:.8rem;line-height:1.6;color:var(--muted);scroll-margin-top:70px;border-radius:4px;max-width:60ch}
  .note::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--claim);opacity:.8}
  .note.v-s{--claim:var(--supported)}.note.v-r{--claim:var(--review)}.note.v-c{--claim:var(--cnv)}.note.v-c::before{background:repeating-linear-gradient(180deg,var(--cnv) 0 3px,transparent 3px 5px)}
  .note .verdict{font-size:.84em;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--claim);white-space:nowrap}
  .note .claimtext{font-family:var(--serif);font-style:italic;font-weight:430;font-size:1.06em;color:var(--text)}
  .note .srcs{display:block;margin-top:4px;font-size:.72rem;color:var(--subtle)}
  .note .srcs a{color:var(--verify);opacity:.8}
  .note .srcs a:hover{opacity:1}
  .note .srcs a::after{content:"\2197";margin-left:2px;font-size:.85em;opacity:.6}
  .note .srcs .none{font-style:italic}
  .note .srcs .cid{margin-left:12px;letter-spacing:.05em;font-variant-numeric:tabular-nums;opacity:.75}
  .note.flash{background:rgba(142,197,236,.1)}

  /* ---- list view ---- */
  .list{display:none;flex-direction:column;gap:15px}
  .hidden{display:none}

  footer{margin-top:60px;border-top:1px solid var(--border);padding-top:22px;font-size:.78rem;color:var(--muted);line-height:1.6;display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
  footer .method{font-family:var(--serif);font-style:italic;color:var(--text);font-size:.9rem;margin-bottom:8px;max-width:56ch;text-wrap:pretty}
  footer>div:first-child{flex:1 1 0;min-width:0}
  footer .studio{font-size:.75rem;color:var(--muted)}
  footer .studio a{color:var(--muted)}
  footer .mark{display:block;margin-left:auto;opacity:.9;transition:opacity .15s}
  footer .mark:hover{opacity:1}
  footer .mark img{height:36px;width:auto;display:block}
</style>

<div class="page">
  <header>
    <div class="brandline"><span class="brand">Big If True</span><span class="brandsub">a Verso fact-check</span></div>
    <h1 id="t-title"></h1>
    <div class="meta" id="t-meta"></div>
  </header>

  <div class="spineblock">
    <div class="spine" id="spine" aria-label="Verdicts in article order"></div>
    <div class="spinecap"><span class="legend"><span><i class="s"></i>supported</span><span><i class="r"></i>needs review</span><span><i class="c"></i>could not verify</span></span><span id="t-count"></span></div>
  </div>

  <section class="lede" id="lede" aria-label="Findings"></section>

  <div class="bar">
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">All <span class="n" id="n-all"></span></button>
      <button class="chip f-r" data-f="r" aria-pressed="false">Needs review <span class="n" id="n-r"></span></button>
      <button class="chip f-c" data-f="c" aria-pressed="false">Could not verify <span class="n" id="n-c"></span></button>
      <button class="chip f-s" data-f="s" aria-pressed="false">Supported <span class="n" id="n-s"></span></button>
    </div>
    <div class="tools">
      <div class="views" role="group" aria-label="View">
        <button id="v-article" aria-pressed="true">Article</button>
        <button id="v-list" aria-pressed="false">Claims</button>
      </div>
      <div class="views export" id="export">
        <button id="x-btn" aria-haspopup="menu" aria-expanded="false">Export</button>
        <div class="menu" id="x-menu" role="menu" hidden>
          <div class="kicker">Copy as</div>
          <div class="row"><button role="menuitem" data-copy="md">Markdown</button><a class="dl" data-dl="md" download hidden title="Download .md" aria-label="Download Markdown">&darr;</a></div>
          <div class="row"><button role="menuitem" data-copy="csv">CSV</button><a class="dl" data-dl="csv" download hidden title="Download .csv" aria-label="Download CSV">&darr;</a></div>
          <div class="row"><button role="menuitem" data-copy="json">JSON</button><a class="dl" data-dl="json" download hidden title="Download .json" aria-label="Download JSON">&darr;</a></div>
          <div class="row sep"><button role="menuitem" data-copy="shown">Shown claims<span class="n" id="x-shown"></span></button></div>
        </div>
      </div>
    </div>
  </div>

  <main>
    <section class="article" id="articleView" aria-label="Annotated article"></section>
    <section class="list" id="listView" aria-label="Claims list"></section>
  </main>

  <footer>
    <div>
      <div class="method">Checked with the <a href="https://verso.ink">Big If True</a> method by Verso. AI can make mistakes, judge the evidence through the links.</div>
      <div class="studio"><a href="https://verso.ink">Verso</a> is an AI studio for media in San Francisco.</div>

<script>
const V={s:"Supported",r:"Needs Review",c:"Could Not Verify"};
const DATA=__BIG_IF_TRUE_DATA__;
const R=DATA.refs,C=DATA.claims,P=DATA.paragraphs||[];
const byId={}; C.forEach(c=>byId[c[0]]=c);
const order=["r","c","s"];
function worst(ids){for(const v of order){if(ids.some(i=>byId[i][1]===v))return v}return "s"}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
document.getElementById("t-title").textContent=DATA.title;
document.getElementById("t-meta").innerHTML=[DATA.source,DATA.byline,DATA.published?"Published "+DATA.published:"",DATA.checked?"Checked "+DATA.checked:""].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
document.getElementById("t-count").textContent=C.length+" claims · article order →";
function noteHTML(c,idPrefix,withClaim){
  const srcs=c[4].length?c[4].map(k=>`<a href="${R[k][1]}" target="_blank" rel="noopener">${esc(R[k][0])}</a>`).join(" &middot;&nbsp;"):`<span class="none">${c[1]==="r"?"no source cited":"no reliable independent source found"}</span>`;
  const claim=withClaim?`<span class="claimtext">${esc(c[2].replace(/[.。]+\s*$/,""))}.</span> `:"";
  return `<div class="note v-${c[1]}" id="${idPrefix}${c[0]}"><span class="verdict">${V[c[1]]}</span> — ${claim}<span class="why">${esc(c[3])}</span><span class="srcs">${srcs}<span class="cid">claim ${c[0]}</span><button class="copy" data-id="${c[0]}" aria-label="Copy claim ${c[0]}">copy</button></span></div>`;
}
// ---- export: copy the findings out of the page ----
// One claim as a paste-ready snippet (Slack, docs, email), the same shape
// as a write-back comment: the passage, verdict, rationale, sources,
// provenance.
function snippet(c){
  const s=c[4].map(k=>R[k]);
  const src=s.length===1?`Source: ${s[0][0]}\n${s[0][1]}`:s.length?`Sources:\n${s.map((x,i)=>`${i+1}. ${x[0]}\n   ${x[1]}`).join("\n")}`:"";
  return [c[5]?`"${c[5]}"`:"",`Verdict: ${V[c[1]]}`,c[3],src,"Fact-check by Big If True (verso.ink)."].filter(Boolean).join("\n\n");
}
function shownClaims(){
  const f=art.getAttribute("data-f");
  return f?C.filter(c=>c[1]===f):C;
}
async function copyText(text,btn,label){
  let ok=true;
  try{await navigator.clipboard.writeText(text)}
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); try{ok=document.execCommand("copy")}catch(_){ok=false} ta.remove();
  }
  if(!btn)return ok;
  const was=btn.innerHTML; btn.classList.add("copied"); btn.textContent=ok?"Copied":"Copy failed";
  setTimeout(()=>{btn.classList.remove("copied");btn.innerHTML=was},1400);
  return ok;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".note .copy"); if(!b)return;
  copyText(snippet(byId[+b.dataset.id]),b);
});
const X=DATA.exports||{}, xBtn=document.getElementById("x-btn"), xMenu=document.getElementById("x-menu");
const FILES={md:["text/markdown","md"],csv:["text/csv","csv"],json:["application/json","json"]};
const slug=(DATA.title||"fact-check").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,60)||"fact-check";
function openMenu(o){
  xMenu.hidden=!o; xBtn.setAttribute("aria-expanded",String(o)); if(!o)return;
  document.getElementById("x-shown").textContent=shownClaims().length;
  xMenu.style.left=xMenu.style.right="";
  if(xMenu.getBoundingClientRect().left<8){xMenu.style.left="0";xMenu.style.right="auto"}
}
xBtn.addEventListener("click",()=>openMenu(xMenu.hidden));
document.addEventListener("click",e=>{if(!e.target.closest("#export"))openMenu(false)});
window.addEventListener("keydown",e=>{if(e.key==="Escape")openMenu(false)});
xMenu.addEventListener("click",e=>{
  const b=e.target.closest("button[data-copy]"); if(!b)return;
  const k=b.dataset.copy;
  const text=k==="shown"?shownClaims().map(snippet).join("\n\n"):X[k];
  if(text!=null)copyText(text,b);
});
// Downloads work when the page is a plain file or its own tab; embedded
// viewers (artifacts) block them, so the links stay hidden there.
if(window.top===window){
  xMenu.querySelectorAll("a.dl").forEach(a=>{
    const k=a.dataset.dl; if(!X[k])return;
    a.href=URL.createObjectURL(new Blob([X[k]],{type:FILES[k][0]+";charset=utf-8"}));
    a.download=`${slug}.${FILES[k][1]}`; a.hidden=false;
  });
}
// article view
const art=document.getElementById("articleView");
let html="";
P.forEach((para,pi)=>{
  let p="",ticks="";
  para.forEach((seg,si)=>{
    const [t,ids,q]=seg;
    let inner;
    if(ids){
      const w=worst(ids),mid=`m${pi}_${si}`;
      inner=`<mark class="${w}" id="${mid}" role="button" tabindex="0" data-ids="${ids.join(",")}" data-p="${pi}">${esc(t)}</mark>`;
      ticks+=`<i class="${w}" data-for="${mid}"></i>`;
    }else inner=esc(t);
    p+= q? `<span class="q">${inner}</span>`:inner;
  });
  html+=`<div class="para">${ticks?`<span class="pmarks" aria-hidden="true">${ticks}</span>`:""}<p>${p}</p><div class="inline-notes hidden" id="ic${pi}"></div></div>`;
});
art.innerHTML=html;
function tickFor(m){return art.querySelector(`.pmarks i[data-for="${m.id}"]`)}
art.addEventListener("click",e=>{
  if(e.target.closest(".ic-close")){closeCards();return}
  const t=e.target.closest(".pmarks i");
  if(t){const m=document.getElementById(t.dataset.for); if(m)toggleMark(m); return}
  const m=e.target.closest("mark"); if(m)toggleMark(m);
});
art.addEventListener("mouseover",e=>{
  const t=e.target.closest(".pmarks i");
  if(t){const m=document.getElementById(t.dataset.for); if(m)m.classList.add("hl"); return}
  const m=e.target.closest("mark");
  if(m){const tk=tickFor(m); if(tk)tk.classList.add("on")}
});
art.addEventListener("mouseout",e=>{
  const t=e.target.closest(".pmarks i");
  if(t){const m=document.getElementById(t.dataset.for); if(m)m.classList.remove("hl"); return}
  const m=e.target.closest("mark");
  if(m&&!m.classList.contains("open")){const tk=tickFor(m); if(tk)tk.classList.remove("on")}
});
art.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const m=e.target.closest("mark"); if(m){e.preventDefault();toggleMark(m);}}});
function closeCards(){
  document.querySelectorAll("mark.open").forEach(x=>x.classList.remove("open"));
  art.querySelectorAll(".pmarks i.on").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".inline-notes").forEach(b=>{b.classList.add("hidden");b.innerHTML=""});
}
function toggleMark(m){
  const ids=m.dataset.ids.split(",").map(Number);
  const already=m.classList.contains("open");
  closeCards();
  if(already)return;
  m.classList.add("open");
  const tk=tickFor(m); if(tk)tk.classList.add("on");
  const box=document.getElementById("ic"+m.dataset.p);
  box.innerHTML=ids.map(i=>noteHTML(byId[i],"a",ids.length>1)).join("")+`<button class="ic-close" aria-label="Close claim details">&times;</button>`;
  box.classList.remove("hidden");
  requestAnimationFrame(()=>{
    const overflow=box.getBoundingClientRect().bottom-window.innerHeight+14;
    if(overflow>0){
      const markRoom=m.getBoundingClientRect().top-64; // keep the clicked sentence visible under the sticky bar
      window.scrollBy({top:Math.min(overflow,Math.max(0,markRoom)),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    }
  });
}
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeCards()});
// list view
const list=document.getElementById("listView");
list.innerHTML=C.map(c=>noteHTML(c,"l",true)).join("");
// spine
const spine=document.getElementById("spine");
spine.innerHTML=C.map(c=>`<i class="${c[1]}" title="Claim ${c[0]}: ${esc(c[2])}" tabindex="0" role="button" aria-label="Jump to claim ${c[0]}: ${esc(c[2])}" data-id="${c[0]}"></i>`).join("");
spine.addEventListener("click",e=>{const s=e.target.closest("i"); if(s)jump(+s.dataset.id);});
spine.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const s=e.target.closest("i"); if(s){e.preventDefault();jump(+s.dataset.id);}}});
function jump(id){
  if(listView.style.display==="flex"){
    const el=document.getElementById("l"+id); if(!el)return;
    el.scrollIntoView({block:"center"}); flash(el); return;
  }
  const m=[...document.querySelectorAll("mark")].find(x=>x.dataset.ids.split(",").map(Number).includes(id));
  if(!m)return;
  m.scrollIntoView({block:"center"});
  if(!m.classList.contains("open"))toggleMark(m);
  flash(m); const card=document.getElementById("a"+id); if(card)flash(card);
}
function flash(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1400)}
// counts + filters
const counts={s:0,r:0,c:0}; C.forEach(c=>counts[c[1]]++);
document.getElementById("n-all").textContent=C.length; document.getElementById("n-r").textContent=counts.r;
document.getElementById("n-c").textContent=counts.c; document.getElementById("n-s").textContent=counts.s;
const chips=document.getElementById("chips");
chips.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b)return;
  chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  const f=b.dataset.f;
  closeCards();
  if(f==="all"){art.removeAttribute("data-f");spine.removeAttribute("data-f");}
  else{art.setAttribute("data-f",f);spine.setAttribute("data-f",f);}
  list.querySelectorAll(".note").forEach(cd=>{cd.style.display=(f==="all"||cd.classList.contains("v-"+f))?"":"none"});
});
// findings lede
const lede=document.getElementById("lede");
lede.innerHTML=`<div class="kicker">What the check found</div>
<p class="topline">${C.length} claims checked against the live web: <b>${counts.r} need review</b>, ${counts.c} could not be independently verified, and ${counts.s} are supported.</p>`;
// view toggle
const articleView=document.getElementById("articleView"), listView=document.getElementById("listView");
const vA=document.getElementById("v-article"), vL=document.getElementById("v-list");
function setView(w){
  const isA=w==="article";
  closeCards();
  articleView.style.display=isA?"":"none";
  listView.style.display=isA?"none":"flex";
  vA.setAttribute("aria-pressed",String(isA)); vL.setAttribute("aria-pressed",String(!isA));
}
vA.addEventListener("click",()=>setView("article"));
vL.addEventListener("click",()=>setView("list"));
if(!P||!P.length){
  vA.style.display="none";
  document.getElementById("t-count").textContent=C.length+" claims · article order →";
  setView("list");
}else{
  setView("article");
}
</script>
